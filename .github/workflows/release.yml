name: Build and release

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\tests\STranslate.Plugin.Bailian.Tests.csproj

      - name: Build and test
        run: dotnet run --project .\tests\STranslate.Plugin.Bailian.Tests.csproj -c Release --no-restore

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: STranslate.Plugin.Translate.Bailian
          path: .\.artifacts\plugins\STranslate.Plugin.Translate.Bailian.spkg

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: ./.artifacts/plugins/STranslate.Plugin.Translate.Bailian.spkg
